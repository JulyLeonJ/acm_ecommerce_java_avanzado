name: CI and ECS deploy

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

# Concurrency: cancel older runs for the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
    # NOTE: No "services:" block here.
    # PostgreSQL is started inside a step (step 5) so that
    # ${{ secrets.* }} are available when the container is created.

    steps:
      # ---------------------------------------------------------------
      # 1 Checkout repository
      # ---------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---------------------------------------------------------------
      # 2 Set up JDK 25 (Temurin)
      # ---------------------------------------------------------------
      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "25"
          cache: "gradle"

      # ---------------------------------------------------------------
      # 3 Make Gradle wrapper executable
      # ---------------------------------------------------------------
      - name: Grant execute permission for Gradle wrapper
        run: chmod +x ./gradlew

      # ---------------------------------------------------------------
      # 4 Cache Gradle dependencies
      # ---------------------------------------------------------------
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 5 Start PostgreSQL via docker run
      # Using a step (not services:) so GitHub Secrets are available.
      # ---------------------------------------------------------------
      - name: Start PostgreSQL
        env:
          POSTGRES_DB: ${{ secrets.DB_NAME }}
          POSTGRES_USER: ${{ secrets.DB_USER }}
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          : "${POSTGRES_DB:?Missing GitHub secret DB_NAME}"
          : "${POSTGRES_USER:?Missing GitHub secret DB_USER}"
          : "${POSTGRES_PASSWORD:?Missing GitHub secret DB_PASSWORD}"
          docker run -d \
            --name postgres \
            -e POSTGRES_DB="$POSTGRES_DB" \
            -e POSTGRES_USER="$POSTGRES_USER" \
            -e POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
            -p 5434:5432 \
            postgres:16-alpine

          echo "Waiting for PostgreSQL to be ready..."
          for i in {1..15}; do
            if docker exec postgres pg_isready -U "$POSTGRES_USER" > /dev/null 2>&1; then
              echo "PostgreSQL is ready!"
              exit 0
            fi
            # Check if container died
            if [ "$(docker inspect -f '{{.State.Running}}' postgres)" != "true" ]; then
              echo "Container stopped unexpectedly. Logs:"
              docker logs postgres
              exit 1
            fi
            echo "Waiting..."
            sleep 2
          done
          echo "Timed out waiting for PostgreSQL. Logs:"
          docker logs postgres
          exit 1

      # ---------------------------------------------------------------
      # 6 Build and run tests
      # Env vars override application.yaml and point to the container above.
      # ---------------------------------------------------------------
      - name: Build and run tests
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5434/${{ secrets.DB_NAME }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.DB_USER }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: ./gradlew clean build --no-daemon

      # ---------------------------------------------------------------
      # 7 Upload test reports (always, even on failure)
      # ---------------------------------------------------------------
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/**
          retention-days: 14

      # ---------------------------------------------------------------
      # 8 Upload application JAR artifact
      # ---------------------------------------------------------------
      - name: Upload build artifact (JAR)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: application-artifact
          path: build/libs/*.jar
          retention-days: 14

  deploy-ecs:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ECS_DEPLOY_ENABLED == 'true'
    runs-on: codebuild-${{ vars.CODEBUILD_RUNNER_PROJECT }}-${{ github.run_id }}-${{ github.run_attempt }}
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      AWS_REGION: us-east-2
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_SERVICE: ${{ vars.ECS_SERVICE }}
      CODEBUILD_RUNNER_PROJECT: ${{ vars.CODEBUILD_RUNNER_PROJECT }}
      SPRING_DATASOURCE_URL: ${{ vars.SPRING_DATASOURCE_URL }}
      SPRING_DATASOURCE_USERNAME: ${{ vars.SPRING_DATASOURCE_USERNAME }}
      DB_SECRET_ARN: ${{ vars.DB_SECRET_ARN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download built application JAR
        uses: actions/download-artifact@v4
        with:
          name: application-artifact
          path: build/libs

      - name: Validate deployment variables
        shell: bash
        run: |
          for variable in CODEBUILD_RUNNER_PROJECT ECR_REPOSITORY ECS_CLUSTER ECS_SERVICE SPRING_DATASOURCE_URL SPRING_DATASOURCE_USERNAME DB_SECRET_ARN; do
            if [[ -z "${!variable}" ]]; then
              echo "Missing GitHub Actions variable: $variable"
              exit 1
            fi
          done
          if grep -q 'REPLACE_WITH_' ecs/task-definition.json; then
            echo "Replace the ECS task execution role placeholder in ecs/task-definition.json."
            exit 1
          fi

      - name: Start Docker daemon
        shell: bash
        run: |
          nohup /usr/local/bin/dockerd --host=unix:///var/run/docker.sock &
          timeout 20 sh -c 'until docker info >/dev/null 2>&1; do sleep 1; done'

      - name: Build and push image to ECR
        id: image
        shell: bash
        run: |
          account_id=$(aws sts get-caller-identity --query Account --output text)
          registry="${account_id}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          image_uri="${registry}/${ECR_REPOSITORY}:${GITHUB_SHA}"
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$registry"
          docker build --platform linux/amd64 --tag "$image_uri" .
          docker push "$image_uri"
          echo "uri=$image_uri" >> "$GITHUB_OUTPUT"

      - name: Register task definition and deploy service
        shell: bash
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
        run: |
          task_definition="$RUNNER_TEMP/task-definition.json"
          jq --arg image "$IMAGE_URI" \
            --arg dbUrl "$SPRING_DATASOURCE_URL" \
            --arg dbUser "$SPRING_DATASOURCE_USERNAME" \
            --arg dbSecretArn "$DB_SECRET_ARN" \
            '(.containerDefinitions[] | select(.name == "acm-ecommerce").image) = $image
            | (.containerDefinitions[] | select(.name == "acm-ecommerce").environment[] | select(.name == "SPRING_DATASOURCE_URL").value) = $dbUrl
            | (.containerDefinitions[] | select(.name == "acm-ecommerce").environment[] | select(.name == "SPRING_DATASOURCE_USERNAME").value) = $dbUser
            | (.containerDefinitions[] | select(.name == "acm-ecommerce").secrets[] | select(.name == "SPRING_DATASOURCE_PASSWORD").valueFrom) = ($dbSecretArn + ":password::")' \
            ecs/task-definition.json > "$task_definition"

          task_definition_arn=$(aws ecs register-task-definition \
            --cli-input-json "file://${task_definition}" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "$task_definition_arn" \
            --region "$AWS_REGION"

          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --region "$AWS_REGION"
